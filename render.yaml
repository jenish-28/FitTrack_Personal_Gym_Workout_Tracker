services:
  - type: web
    name: fittrack-app
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_ACCOUNT
        value: "true"
      - key: NODE_VERSION
        value: "22.21.0"

databases:
  - name: fittrack-db
    plan: free
    databaseName: fittrack
    user: fittrack_user
